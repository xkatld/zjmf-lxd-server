name: Build Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build lxdapi amd64
        run: |
          cd lxdapi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build-output/lxdapi-linux-amd64 main.go

      - name: Build lxdapi arm64
        run: |
          cd lxdapi
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../build-output/lxdapi-linux-arm64 main.go

      - name: Build lxdweb amd64
        run: |
          cd lxdweb
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../build-output/lxdweb-linux-amd64 main.go

      - name: Build lxdweb arm64
        run: |
          cd lxdweb
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../build-output/lxdweb-linux-arm64 main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build-output/
